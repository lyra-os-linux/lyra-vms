[package]
name = "lyra-vms"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Graphical console launcher for Lyra OS virtual machines"
homepage = "https://github.com/lyra-os-linux/lyra-vms"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
uuid = { version = "1.20", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
